name: Publish birthday card

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "root-site/**"
      - "lifeiyu/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp -R root-site/. site/
          cp -R lifeiyu site/lifeiyu
          touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

